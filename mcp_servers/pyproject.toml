[project]
name = "dienstpilot-mcp"
version = "0.1.0"
description = "MCP servers (roster, planning, rules, forecast, notify): thin typed wrappers over the REST API."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28.1", "mcp==2.3.0", "pydantic>=2.14.1", "uvicorn[standard]>=0.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dienstpilot_mcp"]
