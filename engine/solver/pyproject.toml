[project]
name = "dienstpilot-solver"
version = "1.0.0"
description = "C1: roster optimizer on OR-Tools CP-SAT. Pure; independent of the validator."
requires-python = ">=3.12,<3.13"
dependencies = ["ortools>=9.12", "tzdata>=2025.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dienstpilot_solver"]
