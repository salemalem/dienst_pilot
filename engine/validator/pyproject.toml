[project]
name = "dienstpilot-validator"
version = "1.0.0"
description = "C2: rule and compliance validator. Pure; reads the declarative rules; independent of the solver."
requires-python = ">=3.12,<3.13"
dependencies = ["tzdata>=2025.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dienstpilot_validator"]
