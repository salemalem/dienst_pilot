[project]
name = "dienstpilot-ml"
version = "0.1.0"
description = "C3 to C6: features shared by training and serving, models, training. Never reads the generator's ground truth."
requires-python = ">=3.12,<3.13"
# The serving runtime (the API) needs only these two.
dependencies = ["numpy>=2.0", "lightgbm==4.7.0"]

[project.optional-dependencies]
# Training and tracking only; the API never imports these (an import-linter contract checks it).
train = ["mlflow-skinny==3.17.1", "statsmodels==0.14.6", "scipy==1.17.1", "polars>=1.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dienstpilot_ml"]
