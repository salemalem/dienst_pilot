[project]
name = "dienstpilot-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "synthdata", "engine/validator", "engine/solver", "eval"]

[tool.uv.sources]
dienstpilot = { workspace = true }
synthdata = { workspace = true }
dienstpilot-validator = { workspace = true }
dienstpilot-solver = { workspace = true }
dienstpilot-eval = { workspace = true }

[dependency-groups]
dev = [
  "dienstpilot",
  "synthdata[plots]",
  "dienstpilot-eval",
  "hypothesis>=6.130,<6.170",
  "httpx>=0.28.1",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "synthdata/src", "synthdata/tests", "engine/validator/src", "engine/solver/src", "eval/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
# RUF001-003: German copy and date ranges use the en dash and ×.
ignore = ["D100", "D104", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["D"]
"synthdata/tests/**" = ["D"]
"engine/*/tests/**" = ["D"]
"eval/tests/**" = ["D"]
"eval/*.py" = ["D"]
"synthdata/scripts/**" = ["D"]
"backend/migrations/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend/src", "synthdata/src", "engine/validator/src", "engine/solver/src", "eval/src"]
packages = ["dienstpilot", "synthdata", "dienstpilot_validator", "dienstpilot_solver", "dienstpilot_eval"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "synthdata/tests", "engine/validator/tests", "eval/tests"]
pythonpath = ["synthdata/tests"]
addopts = "-q -m 'not seeds'"
markers = [
  "db: needs TEST_DATABASE_URL (a Postgres the tests may wipe)",
  "seeds: generates and checks nine seeds (slow; own CI job)",
]

[tool.importlinter]
root_packages = ["dienstpilot", "synthdata", "dienstpilot_validator", "dienstpilot_solver"]
plugins = ["pydantic.mypy"]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
]

[[tool.importlinter.contracts]]
name = "Shared kernel depends on no context"
type = "forbidden"
source_modules = ["dienstpilot.shared"]
forbidden_modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
  "dienstpilot.main",
  "dienstpilot.app",
  "dienstpilot.engines",
  "dienstpilot.seeding",
]

[[tool.importlinter.contracts]]
name = "The generator never imports the backend"
type = "forbidden"
source_modules = ["synthdata"]
forbidden_modules = ["dienstpilot"]

[[tool.importlinter.contracts]]
name = "The backend never imports the generator (the loader reads Parquet)"
type = "forbidden"
source_modules = ["dienstpilot"]
forbidden_modules = ["synthdata"]

[[tool.importlinter.contracts]]
name = "The application layer uses contexts only through their public services"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dienstpilot.app"]
forbidden_modules = [
  "dienstpilot.identity.models",
  "dienstpilot.organization.models",
  "dienstpilot.requests.models",
  "dienstpilot.planning.models",
  "dienstpilot.operations.models",
  "dienstpilot.audit.models",
]

[[tool.importlinter.contracts]]
name = "Engines depend only on the ports, never on a context"
type = "forbidden"
source_modules = ["dienstpilot.engines"]
forbidden_modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
  "dienstpilot.app",
]

[[tool.importlinter.contracts]]
name = "Optimizer (C1) and validator (C2) are independent implementations"
type = "independence"
modules = ["dienstpilot_validator", "dienstpilot_solver"]

[[tool.importlinter.contracts]]
name = "The engines know nothing of the backend or the generator"
type = "forbidden"
source_modules = ["dienstpilot_validator", "dienstpilot_solver"]
forbidden_modules = ["dienstpilot", "synthdata"]
