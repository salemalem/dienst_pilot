[project]
name = "dienstpilot-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["backend", "synthdata", "engine/validator", "engine/solver", "eval", "ml", "agents", "mcp_servers"]

[tool.uv]
package = false
constraint-dependencies = [
  # 7-day release-age rule: transitive packages of mlflow that were newer than 7 days when added.
  "cachetools<7.2.2",
  "databricks-sdk<0.153.0",
  "zipp<4.1.2",
  # Phase 10a: transitive packages of mcp and tokenizers that were newer than 7 days.
  "filelock<=4.2.0",
  "httpx2<=2.13.1",
  "httpcore2<=2.13.1",
]

[tool.uv.sources]
dienstpilot = { workspace = true }
synthdata = { workspace = true }
dienstpilot-validator = { workspace = true }
dienstpilot-solver = { workspace = true }
dienstpilot-eval = { workspace = true }
dienstpilot-ml = { workspace = true }
dienstpilot-agents = { workspace = true }
dienstpilot-mcp = { workspace = true }

[dependency-groups]
dev = [
  "dienstpilot",
  "synthdata[plots]",
  "dienstpilot-eval",
  "dienstpilot-ml[train]",
  "dienstpilot-agents",
  "dienstpilot-mcp",
  "hypothesis>=6.130,<6.170",
  "httpx>=0.28.1",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "agents/src", "agents/tests", "mcp_servers/src", "mcp_servers/tests", "synthdata/src", "synthdata/tests", "engine/validator/src", "engine/solver/src", "eval/src", "ml/src", "ml/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
# RUF001-003: German copy and date ranges use the en dash and ×.
ignore = ["D100", "D104", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["D"]
"synthdata/tests/**" = ["D"]
"engine/*/tests/**" = ["D"]
"eval/tests/**" = ["D"]
"ml/tests/**" = ["D"]
"eval/*.py" = ["D"]
"synthdata/scripts/**" = ["D"]
"backend/migrations/**" = ["D"]
"agents/tests/**" = ["D"]
"mcp_servers/tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend/src", "agents/src", "mcp_servers/src", "synthdata/src", "engine/validator/src", "engine/solver/src", "eval/src", "ml/src"]
packages = ["dienstpilot", "dienstpilot_agents", "dienstpilot_mcp", "synthdata", "dienstpilot_validator", "dienstpilot_solver", "dienstpilot_eval", "dienstpilot_ml"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "mlflow.*", "lightgbm.*", "scipy.*", "jsonschema.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "agents/tests", "mcp_servers/tests", "synthdata/tests", "engine/validator/tests", "eval/tests", "ml/tests"]
pythonpath = ["synthdata/tests", "mcp_servers/tests"]
addopts = "-q -m 'not seeds'"
markers = [
  "db: needs TEST_DATABASE_URL (a Postgres the tests may wipe)",
  "seeds: generates and checks nine seeds (slow; own CI job)",
  "production_solver: run C1 with the production settings (the scripted demo scenarios)",
]

[tool.importlinter]
include_external_packages = true
root_packages = ["dienstpilot", "dienstpilot_agents", "dienstpilot_mcp", "synthdata", "dienstpilot_validator", "dienstpilot_solver", "dienstpilot_ml"]
plugins = ["pydantic.mypy"]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
]

[[tool.importlinter.contracts]]
name = "Shared kernel depends on no context"
type = "forbidden"
source_modules = ["dienstpilot.shared"]
forbidden_modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
  "dienstpilot.main",
  "dienstpilot.app",
  "dienstpilot.engines",
  "dienstpilot.seeding",
  "dienstpilot.workflows",
  "dienstpilot.recording",
]

[[tool.importlinter.contracts]]
name = "The generator never imports the backend"
type = "forbidden"
source_modules = ["synthdata"]
forbidden_modules = ["dienstpilot"]

[[tool.importlinter.contracts]]
name = "The backend never imports the generator (the loader reads Parquet)"
type = "forbidden"
source_modules = ["dienstpilot"]
forbidden_modules = ["synthdata"]

[[tool.importlinter.contracts]]
name = "The application layer uses contexts only through their public services"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dienstpilot.app", "dienstpilot.workflows", "dienstpilot.recording"]
forbidden_modules = [
  "dienstpilot.identity.models",
  "dienstpilot.organization.models",
  "dienstpilot.requests.models",
  "dienstpilot.planning.models",
  "dienstpilot.operations.models",
  "dienstpilot.audit.models",
  "dienstpilot.fairness.models",
  "dienstpilot.notifications.models",
]

[[tool.importlinter.contracts]]
name = "Engines depend only on the ports, never on a context"
type = "forbidden"
source_modules = ["dienstpilot.engines"]
forbidden_modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
  "dienstpilot.app",
]

[[tool.importlinter.contracts]]
name = "Optimizer (C1) and validator (C2) are independent implementations"
type = "independence"
modules = ["dienstpilot_validator", "dienstpilot_solver"]

[[tool.importlinter.contracts]]
name = "The engines know nothing of the backend or the generator"
type = "forbidden"
source_modules = ["dienstpilot_validator", "dienstpilot_solver"]
forbidden_modules = ["dienstpilot", "synthdata"]

[[tool.importlinter.contracts]]
name = "The API never imports the training stack (it loads bundles with numpy and LightGBM only)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dienstpilot"]
forbidden_modules = ["dienstpilot_ml.training", "mlflow", "statsmodels", "scipy"]

[[tool.importlinter.contracts]]
name = "ML code knows nothing of the backend or the generator"
type = "forbidden"
source_modules = ["dienstpilot_ml"]
forbidden_modules = ["dienstpilot", "synthdata"]

[[tool.importlinter.contracts]]
name = "Serving-side ML modules do not import the training stack"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "dienstpilot_ml.features",
  "dienstpilot_ml.absence_forecast",
  "dienstpilot_ml.preference_learner",
  "dienstpilot_ml.cover_ranker",
  "dienstpilot_ml.leave_surrogate",
]
forbidden_modules = ["dienstpilot_ml.training", "mlflow", "statsmodels", "scipy"]

[[tool.importlinter.contracts]]
name = "Agents know nothing of the backend (it imports them, never the reverse)"
type = "forbidden"
source_modules = ["dienstpilot_agents"]
forbidden_modules = ["dienstpilot", "dienstpilot_mcp", "synthdata"]

[[tool.importlinter.contracts]]
name = "MCP servers reach the system only through the REST API"
type = "forbidden"
source_modules = ["dienstpilot_mcp"]
forbidden_modules = ["dienstpilot", "dienstpilot_agents", "synthdata", "dienstpilot_ml"]
