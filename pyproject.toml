[project]
name = "dienstpilot-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
dienstpilot = { workspace = true }

[dependency-groups]
dev = [
  "dienstpilot",
  "httpx>=0.28.1",
  "import-linter>=2.15",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["D"]
"backend/migrations/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
packages = ["dienstpilot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.importlinter]
root_package = "dienstpilot"

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
]

[[tool.importlinter.contracts]]
name = "Shared kernel depends on no context"
type = "forbidden"
source_modules = ["dienstpilot.shared"]
forbidden_modules = [
  "dienstpilot.identity",
  "dienstpilot.organization",
  "dienstpilot.requests",
  "dienstpilot.planning",
  "dienstpilot.operations",
  "dienstpilot.fairness",
  "dienstpilot.notifications",
  "dienstpilot.audit",
  "dienstpilot.main",
]
