[project]
name = "synthdata"
version = "1.0.0"
description = "Seeded synthetic data for the fictional Klinik für Innere Medizin, Klinikum Musterstadt."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.3.0",
  "polars>=1.30.0",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10.0"]

[project.scripts]
synthdata = "synthdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthdata"]
