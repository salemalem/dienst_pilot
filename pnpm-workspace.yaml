packages:
  - "apps/*"
  - "packages/*"

# Expo/Metro needs a flat node_modules in a pnpm workspace.
nodeLinker: hoisted

# Supply-chain guard: only install releases that are at least seven days old.
minimumReleaseAge: 10080

# TEMPORARY (added 2026-10-20): the exact versions below were already locked when the guard
# went from 1 to 7 days and are younger than 7 days (react-native 0.88.0 is required by Expo
# SDK 58). The newest was published on 2026-10-19, so all are 7 days old by 2026-10-26: remove this
# list then (tracked in a GitHub issue). Only these exact versions are exempt.
minimumReleaseAgeExclude:
  - "2g@1.0.1"
  - "@expo/cli@58.1.12"
  - "@expo/config-plugins@58.0.9"
  - "@expo/config@58.0.6"
