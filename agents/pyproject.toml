[project]
name = "dienstpilot-agents"
version = "0.1.0"
description = "C7 and C8 agents, the RAG rulebook and the LLM port adapter. Imports no backend context."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "onnxruntime==1.31.0",
  "sqlalchemy[asyncio]>=2.1.5",
  "tokenizers==0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dienstpilot_agents"]
