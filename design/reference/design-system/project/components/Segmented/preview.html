<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented — preview</title>
<style>body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .stack{display:flex;flex-direction:column;gap:16px} .k{color:var(--ink-muted);min-width:7.5em}</style>

<body>
<div class="stack" id="root"></div>
<script>
  var D = window.DienstPilot, r = document.getElementById("root");
  r.append(

    D.Segmented({ label: "Darstellung", options: [{ value: "auto", label: "Automatisch (20–7 Uhr dunkel)" }, { value: "light", label: "Hell" }, { value: "dark", label: "Dunkel" }], value: "auto" }));
</script>
