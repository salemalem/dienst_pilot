<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>M11 Mitteilungen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="dp-tokens.css">
<link rel="stylesheet" href="ds/dienstpilot/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--action)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="dp-root" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
  <div style="height: 47px; flex: none" aria-hidden="true"></div>
  <div class="dp-env dp-env--bar caption" role="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.625" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"></path><path d="M6.453 15h11.094"></path><path d="M8.5 2h7"></path></svg>
    <span>Demo-Umgebung, synthetische Daten</span>
  </div>
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span class="caption" style="color: var(--ink-muted)">Mitteilungen</span>
      <h1 class="title">2 neue Entscheidungen</h1>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-control)">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <li style="display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--rule)">
          <span style="width: 20px; flex: none; margin-top: 2px">
            <sc-if value="{{it.letter}}" hint-placeholder-val="{{true}}">
              <span class="dp-chip dp-chip--sm {{it.chip}}" role="img" aria-label="{{it.chipName}}"><span aria-hidden="true">{{it.letter}}</span></span>
            </sc-if>
          </span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 8px">
              <span class="body-strong" style="flex-grow: 1">{{it.title}}</span>
              <span class="num-small" style="color: var(--ink-muted); white-space: nowrap">{{it.time}}</span>
            </div>
            <span class="body" style="color: var(--ink)">{{it.text}}</span>
            <sc-if value="{{it.reason}}" hint-placeholder-val="{{false}}">
              <span class="body" style="color: var(--ink)"><span style="font-weight: 650">Begründung:</span> {{it.reason}}</span>
            </sc-if>
            <sc-if value="{{it.fresh}}" hint-placeholder-val="{{false}}">
              <span class="caption" style="align-self: flex-start; margin-top: 4px; padding: 0 6px; border: 1px solid var(--rule-strong); border-radius: var(--radius-mark)">Neu</span>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </main>
  <nav aria-label="Hauptnavigation" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--sheet); border-top: 1px solid var(--rule)">
    <a class="label" href="M02-Heute.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; text-decoration: none; color: var(--ink-muted)">Heute</a>
    <a class="label" href="M03-Dienstplan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; text-decoration: none; color: var(--ink-muted)">Dienstplan</a>
    <a class="label" href="M11-Mitteilungen.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 56px; text-decoration: none; color: var(--action); box-shadow: inset 0 3px 0 var(--action)">Mitteilungen</a>
    <a class="label" href="M09-Fairness.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; text-decoration: none; color: var(--ink-muted)">Mehr</a>
  </nav>
  <div style="height: 34px; flex: none; background: var(--sheet)" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { fresh: true, chip: 'dp-shift--frei', letter: 'U', chipName: 'Urlaub', title: 'Urlaub genehmigt', time: 'heute 11:48',
          text: '14.–27.07.2027, mit Tausch: Sie arbeiten am Wochenende 12./13.06.2027. Entschieden von Dr. Thomas Brandt.', reason: '' },
        { fresh: true, chip: 'dp-shift--spaet', letter: 'S', chipName: 'Spät', title: 'Tausch bestätigt', time: 'heute 08:15',
          text: 'Sie übernehmen den Spätdienst am Fr 30.10. von Dr. Ines Becker. Alle Regeln bleiben eingehalten, deshalb automatisch bestätigt.', reason: '' },
        { fresh: false, chip: '', letter: '', chipName: '', title: 'Dienstplan November veröffentlicht', time: 'Mo 19.10.',
          text: 'Freigegeben von Dr. Thomas Brandt. Ihre beiden wichtigen Wünsche sind erfüllt.', reason: '' },
        { fresh: false, chip: '', letter: '', chipName: '', title: 'Wunschphase Dezember geöffnet', time: 'Mo 12.10.',
          text: 'Wünsche können bis Mo 26.10. abgegeben werden.', reason: '' },
        { fresh: false, chip: 'dp-shift--frei', letter: 'U', chipName: 'Urlaub', title: 'Urlaub abgelehnt', time: 'Do 08.10.',
          text: '31.12.2026.', reason: 'An Silvester ist die Mindestbesetzung im Nachtdienst sonst nicht erreichbar. Der 02.01.2027 wäre möglich.' }
      ]
    };
  }
}
</script>
</body>
</html>
