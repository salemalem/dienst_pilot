name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, import-linter, pytest, benchmark smoke)
    runs-on: ubuntu-latest
    env:
      DIENSTPILOT_SEED_DIR: data/synthetic/v1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - run: uv sync --frozen
      - name: Generate the dataset from the seed
        run: uv run python -m synthdata generate --out data/synthetic/v1
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy
      - run: uv run lint-imports
      - name: Tests, incl. the property test "every solver output passes the validator"
        run: uv run pytest
      - name: Benchmark smoke run reproduces the committed result (C1 vs baseline, one month)
        run: |
          expected=$(python3 -c "import json; print(json.load(open('eval/results/benchmark_smoke.json'))['results_sha256'])")
          uv run python eval/run_benchmark.py --smoke --data data/synthetic/v1
          actual=$(python3 -c "import json; print(json.load(open('eval/results/benchmark_smoke.json'))['results_sha256'])")
          test "$expected" = "$actual" || { echo "smoke benchmark changed: $expected -> $actual"; exit 1; }
      - name: ARCHITECTURE §17.1 table matches eval/results/benchmark.json
        run: uv run python eval/render_tables.py --check

  seed:
    name: Seed loads into Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dienstpilot
          POSTGRES_PASSWORD: dienstpilot
          POSTGRES_DB: dienstpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dienstpilot -d dienstpilot"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://dienstpilot:dienstpilot@localhost:5432/dienstpilot
      TEST_DATABASE_URL: postgresql+psycopg://dienstpilot:dienstpilot@localhost:5432/dienstpilot
      TEST_REDIS_URL: redis://localhost:6379/15
      DIENSTPILOT_SEED_DIR: data/synthetic/v1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - run: uv sync --frozen
      - name: Generate the dataset from the seed
        run: uv run python -m synthdata generate --out data/synthetic/v1
      - name: Migrate a fresh database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Load the seed
        run: uv run python -m dienstpilot.seeding data/synthetic/v1
      - name: Database and API tests (seed, flows with C1/C2, the arq queue on Redis)
        run: uv run pytest -m db backend/tests

  seeds:
    name: Generator across nine seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - run: uv sync --frozen
      - name: Every published month of every seed breaks only coverage
        run: uv run pytest -m seeds synthdata/tests

  node:
    name: TypeScript (tokens, eslint, tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build design tokens (web + native)
        run: pnpm build:packages
      - run: pnpm exec eslint .
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm format:check
      - name: Bundle the staff app for native (iOS) and web
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform ios --output-dir /tmp/expo-ios
          pnpm exec expo export --platform web --output-dir /tmp/expo-web

  api-client:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dienstpilot/api-client generate
      - run: git diff --exit-code packages/api-client

  e2e:
    name: Playwright e2e (planner dashboard on the demo clock)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dienstpilot
          POSTGRES_PASSWORD: dienstpilot
          POSTGRES_DB: dienstpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dienstpilot -d dienstpilot"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+psycopg://dienstpilot:dienstpilot@localhost:5432/dienstpilot
      E2E_REDIS_URL: redis://localhost:6379/14
      DIENSTPILOT_SEED_DIR: data/synthetic/v1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Install the browser
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Seed, start the API and the worker, build the dashboard, run the specs
        run: pnpm --filter @dienstpilot/dashboard e2e
