name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  node:
    name: TypeScript (tokens, eslint, tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build design tokens (web + native)
        run: pnpm build:packages
      - run: pnpm exec eslint .
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm format:check
      - name: Bundle the staff app for native (iOS) and web
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform ios --output-dir /tmp/expo-ios
          pnpm exec expo export --platform web --output-dir /tmp/expo-web

  api-client:
    name: API client is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no floating major tag)
        with:
          version: "0.11.26"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dienstpilot/api-client generate
      - run: git diff --exit-code packages/api-client
